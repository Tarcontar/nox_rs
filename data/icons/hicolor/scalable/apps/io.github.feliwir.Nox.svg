<?xml version="1.0" encoding="UTF-8"?>
<!-- Nox app icon: a night sky with a crescent moon over a timeline (clips
     and the playhead). 128×128, GNOME app icon grid. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="sky" x1="0" y1="12" x2="0" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d3f8f"/>
      <stop offset="1" stop-color="#16173f"/>
    </linearGradient>
    <linearGradient id="moon" x1="70" y1="18" x2="104" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset="1" stop-color="#f6d365"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="97" cy="31" r="17" fill="#000"/>
    </mask>
  </defs>
  <!-- Body with a darker edge below, for depth. -->
  <rect x="8" y="16" width="112" height="100" rx="20" fill="#0d0e2b"/>
  <rect x="8" y="12" width="112" height="100" rx="20" fill="url(#sky)"/>
  <!-- Stars -->
  <g fill="#fff">
    <circle cx="30" cy="30" r="2.2" opacity="0.9"/>
    <circle cx="50" cy="22" r="1.4" opacity="0.7"/>
    <circle cx="44" cy="46" r="1.6" opacity="0.75"/>
    <circle cx="64" cy="34" r="1.1" opacity="0.6"/>
  </g>
  <!-- Moon -->
  <circle cx="86" cy="40" r="20" fill="url(#moon)" mask="url(#crescent)"/>
  <!-- Timeline: two tracks of clips -->
  <rect x="20" y="70" width="88" height="34" rx="6" fill="#000" opacity="0.25"/>
  <rect x="24" y="74" width="34" height="12" rx="3" fill="#62a0ea"/>
  <rect x="61" y="74" width="43" height="12" rx="3" fill="#99c1f1"/>
  <rect x="24" y="89" width="50" height="11" rx="3" fill="#57e389"/>
  <rect x="77" y="89" width="27" height="11" rx="3" fill="#ffbe6f"/>
  <!-- Playhead -->
  <rect x="68" y="66" width="3" height="40" rx="1.5" fill="#f66151"/>
  <path d="M63.5 62h12l-6 7z" fill="#f66151"/>
</svg>
