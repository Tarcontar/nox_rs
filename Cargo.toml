[package]
name = "nox"
version = "0.1.0"
edition = "2021"
description = "A GPU-agnostic video editor built with Rust, GTK4, and FFmpeg"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
gdk = { package = "gdk4", version = "0.9" }
gsk = { package = "gsk4", version = "0.9" }
glib = { version = "0.20", features = ["log_macros"] }
gio = { version = "0.20", features = ["v2_74"] }
graphene = { package = "graphene-rs", version = "0.20" }
pango = { version = "0.20" }

ffmpeg-sys-next = "7.1"

log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "2"
once_cell = "1.19"

[build-dependencies]
glib-build-tools = "0.20"
